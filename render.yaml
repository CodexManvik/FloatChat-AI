services:
  - type: web
    name: floatchat-backend
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python ingest.py --if-empty && uvicorn main:app --host=0.0.0.0 --port=$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floatchat-postgres
          property: connectionString
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: floatchat-frontend
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: BACKEND_URL
        sync: false

databases:
  - name: floatchat-postgres
    databaseName: argo
